<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <script type="module" crossorigin src="/goit-js-hw-09/2-form.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-09/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-09/assets/styles-Da5BtXR4.css">
  </head>

  <body>
    <main>
      <div class="container">
        <h1 class="main-title">Form</h1>
      </div>

      <a class="back-link" href="./index.html">Go back</a>

      <form class="feedback-form" autocomplete="off">
        <label class="label-form">
          Email
          <input class="input-form" type="email" name="email" autofocus />
        </label>
        <label class="label-form textarea">
          Message
          <textarea
            class="input-form textarea"
            name="message"
            rows="8"
          ></textarea>
        </label>
        <button class="form-btn" type="submit">Submit</button>
      </form>
    </main>

  </body>
</html>
